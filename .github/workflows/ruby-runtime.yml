name: Embedded Ruby 3.4

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, 'fix/ruby-3.4']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruby-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Ruby 3.4 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.x'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby bison libffi-dev libyaml-dev zlib1g-dev
          python -m pip install 'meson>=1.10' ninja
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ruby bison libffi libyaml pkgconf
          python -m pip install 'meson>=1.10' ninja
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix libyaml)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            bison diffutils make patch
            mingw-w64-x86_64-gcc mingw-w64-x86_64-meson
            mingw-w64-x86_64-ruby mingw-w64-x86_64-libffi
            mingw-w64-x86_64-libyaml mingw-w64-x86_64-zlib
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: |
          meson setup build/ruby -Druby_tests_only=true --buildtype=release
          meson test -C build/ruby --print-errorlogs
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          meson setup build/ruby -Druby_tests_only=true --buildtype=release
          meson test -C build/ruby --print-errorlogs
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-logs-${{ matrix.os }}
          path: |
            build/ruby/meson-logs/**
            build/ruby/subprojects/ruby-3.4.12/build/config.log
            build/ruby/subprojects/ruby-3.4.12/build/ext/**/mkmf.log
