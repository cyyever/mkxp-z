name: Embedded Ruby 3.4

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, 'fix/ruby-3.4']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruby-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Ruby 3.4 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.x'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby bison zlib1g-dev
          python -m pip install 'meson>=1.10' ninja
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ruby bison pkgconf
          python -m pip install 'meson>=1.10' ninja
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: |
          meson setup build/ruby -Druby_tests_only=true --buildtype=release
          meson test -C build/ruby --print-errorlogs
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-logs-${{ matrix.os }}
          path: |
            build/ruby/meson-logs/**
            build/ruby/subprojects/ruby-3.4.12/build/config.log
            build/ruby/subprojects/ruby-3.4.12/build/ext/**/mkmf.log

  runtime-windows-native:
    name: Ruby 3.4 / Windows MSVC
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up native MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install native build tools and zlib
        run: |
          python -m pip install 'meson>=1.10' ninja cmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install pkgconfiglite --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Static zlib with the same dynamic MSVC CRT as the embedded Ruby.
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md --x-install-root="$env:RUNNER_TEMP/native-sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "PKG_CONFIG_PATH=$env:RUNNER_TEMP/native-sdk/x64-windows-static-md/lib/pkgconfig" >> $env:GITHUB_ENV
      - name: Build and test native embedded Ruby
        run: |
          $env:PATH = "$(Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64');$env:PATH"
          meson setup build/ruby -Druby_tests_only=true --buildtype=release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          meson test -C build/ruby --print-errorlogs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-logs-windows-msvc
          path: |
            build/ruby/meson-logs/**
            build/ruby/subprojects/ruby-3.4.12/build/*.log
            build/ruby/subprojects/ruby-3.4.12/build/ext/**/mkmf.log
