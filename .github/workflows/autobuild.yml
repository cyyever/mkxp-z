name: Automatic Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  workflow_dispatch:

concurrency:
  group: engine-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-source-tarball:
    name: ${{ matrix.job-name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - job-name: Source tarball with dependencies
            artifact-name: source-with-dependencies
            dist-subprojects: all
          - job-name: Source tarball without dependencies
            artifact-name: source-without-dependencies
            dist-subprojects: none
    steps:
      - uses: benjlevesque/short-sha@v4.0
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison ccache cmake diffutils git make ruby
          # The Meson version provided by APT is too old so we install Meson using pip instead
          sudo apt install -y ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc g++
          # SDL3 is built with CMake and needs system video/audio headers (libraries are loaded at runtime)
          sudo apt install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev

          sudo apt install -y gzip tar zstd

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare tarball
        run: |
          meson subprojects download
          meson setup -Ddist_subprojects=${{ matrix.dist-subprojects }} build
          meson dist -C build --no-tests --formats gztar
          mv build/meson-dist/*.tar.gz dist.tar.gz

      - name: Repack tarball deterministically
        run: |
          mkdir dist
          tar -C dist -xzf dist.tar.gz
          rm dist.tar.gz
          tar -C dist --mtime=@$(git show --no-patch --format=%ct) --sort=name --format=posix --mode=a=rX,u+w --owner=0 --group=0 --numeric-owner --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime -cf dist.tar "$(ls dist)"
          zstd --rm -T0 --ultra -20 dist.tar
          mv dist.tar.zst mkxp-z.${{ matrix.artifact-name }}.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: mkxp-z.${{ matrix.artifact-name }}.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}.tar.zst
          archive: false

  build-windows-native:
    name: Windows x86_64 / MSVC
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Set up native MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install native build tools
        run: python -m pip install 'meson>=1.10' ninja cmake
      - name: Configure, build and test native engine
        run: |
          # Ruby source preparation uses Git utilities; keep the native MSVC linker first.
          $env:PATH = "$(Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64');$env:PATH"
          meson setup build --buildtype=release --prefix "$pwd/build/artifact" -Ddefault_system=disabled
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          meson compile -C build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/sdl3/engine-smoke.py build/mkxp-z.x86_64.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/ruby/script-names.py build/mkxp-z.x86_64.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          meson install -C build --no-rebuild --tags mkxp-z
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.windows.msvc.x86_64.${{ github.sha }}
          path: build/artifact
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-build-logs
          path: |
            build/meson-logs/**
            build/subprojects/ruby-4.0.9/build/*.log

  build-linux-native-container:
    name: Ubuntu 26.04 x86_64
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: benjlevesque/short-sha@v4.0
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          apt update
          apt install -y bison ccache cmake diffutils git make ninja-build python3-venv ruby
          python3 -m venv /opt/meson
          /opt/meson/bin/pip install 'meson>=1.10'
          echo '/opt/meson/bin' >> "$GITHUB_PATH"
          apt install -y gcc g++ xvfb xauth libgl1-mesa-dri
          # SDL3 is built with CMake and needs system video/audio headers (libraries are loaded at runtime)
          apt install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore from cache
        if: false
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: ubuntu-26.04-x86_64-
          restore-keys: ubuntu-26.04-x86_64-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        run: |
          meson setup --prefix "$(pwd)/build/artifact" --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: false
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: ubuntu-26.04-x86_64-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Smoke test the real SDL3 engine
        run: xvfb-run -a python3 tests/sdl3/engine-smoke.py build/mkxp-z.x86_64

      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.linux.ubuntu.26.04.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-macos:
    name: macOS 27 ${{ matrix.arch_mkxpz }} (build)
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: '27.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: arm64
            cache: true
    steps:
      - uses: benjlevesque/short-sha@v4.0
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          brew install -q bison ccache cmake diffutils git make meson ruby

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: macos-${{ matrix.arch_mkxpz }}-
          restore-keys: macos-${{ matrix.arch_mkxpz }}-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Verify macOS 27 SDK
        run: test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 27

      - name: Configure
        run: |
          meson setup --prefix "$(pwd)/build/artifact" --cross-file macos/meson-${{ matrix.arch_mkxpz }}.txt --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: ${{ matrix.cache }}
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: macos-${{ matrix.arch_mkxpz }}-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifacts
        run: |
          meson install -C build --no-rebuild --tags mkxp-z-bundle
          mv build/artifact build/artifact-bundle
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.macos.${{ matrix.arch_mkxpz }}.standalone.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.macos.${{ matrix.arch_mkxpz }}.app.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact-bundle
