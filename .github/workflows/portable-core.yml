name: Portable C++26 core

on:
  push:
    branches: [dev, 'modernize/**']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
          - name: macOS Apple Clang (C++ and Objective-C++)
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      OBJCXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 clang-19
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Install Meson and Ninja
        run: python -m pip install 'meson>=1.10' ninja
      - name: Configure
        run: meson setup build/core -Dcore_tests_only=true --buildtype=release
      - name: Build and test
        run: meson test -C build/core --print-errorlogs
