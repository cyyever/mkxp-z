name: SDL3 migration

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdl3-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-api:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / SDL3
            os: ubuntu-26.04
            cc: gcc
            cxx: g++
          - name: Apple Clang / SDL3
            os: xcode-27
            cc: clang
            cxx: clang++
          - name: Windows MSVC / SDL3
            os: windows-2025-vs2026
            cc: cl
            cxx: cl
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/sdk
      PKG_CONFIG_PATH: ${{ github.workspace }}/build/sdk/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/sdk/lib
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/sdk/lib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up native MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install 'meson>=1.10' ninja cmake
      - name: Install Ruby 3.4 for IO ownership tests
        if: runner.os == 'Linux'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Restore SDL3 SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: build/sdk
          key: sdl3-sdk-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/build-sdl3-sdk.py', 'subprojects/sdl3.wrap', 'subprojects/sdl3_image.wrap', 'subprojects/sdl3_ttf.wrap', 'subprojects/freetype.wrap') }}
      - name: Build pinned SDL3 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: python .github/scripts/build-sdl3-sdk.py
      - name: Add SDL runtime libraries to PATH
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_PATH']).open('a') as output:
              output.write(str(Path('build/sdk/bin').resolve()) + '\n')
          PY
      - name: Configure focused regression tests
        if: runner.os != 'Windows'
        run: |
          meson setup build/audio tests/audio --buildtype=release -Dcmake_prefix_path="$CMAKE_PREFIX_PATH"
          meson setup build/sdl3 tests/sdl3 --buildtype=release -Dcmake_prefix_path="$CMAKE_PREFIX_PATH"
      - name: Build and run SDL3 regressions
        if: runner.os != 'Windows'
        run: |
          meson test -C build/audio --print-errorlogs
          meson test -C build/sdl3 --print-errorlogs
      - name: Configure and test with the native Windows linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64');$env:PATH"
          meson setup build/audio tests/audio --buildtype=release "-Dcmake_prefix_path=$env:CMAKE_PREFIX_PATH"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          meson setup build/sdl3 tests/sdl3 --buildtype=release "-Dcmake_prefix_path=$env:CMAKE_PREFIX_PATH"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          meson test -C build/audio --print-errorlogs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          meson test -C build/sdl3 --print-errorlogs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check Ruby and SDL3 IO ownership
        if: runner.os == 'Linux'
        run: |
          ruby_pkgconfig="$(ruby -rrbconfig -e 'puts RbConfig::CONFIG.fetch("libdir")')/pkgconfig"
          export PKG_CONFIG_PATH="$ruby_pkgconfig:$PKG_CONFIG_PATH"
          meson setup build/io tests/io --buildtype=release -Dcmake_prefix_path="$CMAKE_PREFIX_PATH"
          meson test -C build/io --print-errorlogs
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdl3-regressions-${{ matrix.os }}
          path: |
            build/audio/meson-logs/**
            build/sdl3/meson-logs/**
            build/io/meson-logs/**
            build/sdl3-sdk/**/CMakeCache.txt
            build/sdl3-sdk/**/CMakeConfigureLog.yaml

  freebsd:
    name: FreeBSD 15.1 RELEASE / SDL3
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Test the latest supported FreeBSD RELEASE
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          prepare: |
            pkg install -y python3 meson cmake ninja pkgconf
          run: |
            set -eu
            export CC=clang CXX=clang++
            meson setup build/core -Dcore_tests_only=true --buildtype=release
            meson test -C build/core --print-errorlogs
            python3 .github/scripts/build-sdl3-sdk.py
            export CMAKE_PREFIX_PATH="$PWD/build/sdk"
            export PKG_CONFIG_PATH="$CMAKE_PREFIX_PATH/lib/pkgconfig"
            export LD_LIBRARY_PATH="$CMAKE_PREFIX_PATH/lib"
            meson setup build/audio tests/audio --buildtype=release -Dcmake_prefix_path="$CMAKE_PREFIX_PATH"
            meson setup build/sdl3 tests/sdl3 --buildtype=release -Dcmake_prefix_path="$CMAKE_PREFIX_PATH"
            meson test -C build/audio --print-errorlogs
            meson test -C build/sdl3 --print-errorlogs
      - name: Upload FreeBSD diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdl3-regressions-freebsd-15.1
          path: |
            build/core/meson-logs/**
            build/audio/meson-logs/**
            build/sdl3/meson-logs/**
            build/sdl3-sdk/**/CMakeConfigureLog.yaml
